name: Build for Linux x64 (ubuntu binaries)

on:
  push:
  pull_request:

jobs:
  build-linux-x64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Cache dependencies
        uses: actions/cache@v2
        with:
          path: /var/cache/apt
          key: ${{ runner.os }}-apt-${{ hashFiles('**/apt-lock') }}
          restore-keys: ${{ runner.os }}-apt-

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y cmake libsdl2-dev libsdl2-mixer-dev libsdl2-net-dev

      - name: Build
        run: |
          cmake . -DCMAKE_BUILD_TYPE=Release -DUSE_SDL=2
          cmake --build . --config Release

#      - name: Test
#        run: |
#          cd build
#          ctest --output-on-failure
