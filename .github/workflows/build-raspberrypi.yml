name: Build for Raspberry Pi

on:
  push:
  pull_request:

jobs:
  build-raspberrypi:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [ armv7l ]
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y cmake libsdl2-dev libsdl2-mixer-dev libsdl2-net-dev
          sudo apt-get install -y gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf

      - name: Build
        run: |
          echo `which gcc-arm-linux-gnueabihf`
          cmake . -DTARGETOS=PI -DDCMAKE_PREFIX_PATH=/usr/local/lib/cmake/SDL2 -DCMAKE_MODULE_PATH=./tools -DCMAKE_TOOLCHAIN_FILE=./tools/armv7-rpi-linux-gnueabihf.cmake -DUSE_SDL=2 
          cmake --build . --config Release

