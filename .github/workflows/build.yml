name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        arch: [armv7l]
        include:
          - os: ubuntu-latest
            arch: armv7l
            compiler: gcc
            if: matrix.arm-arch == 'armv7l'
          - os: ubuntu-latest
            arch: x86_64
            compiler: gcc
          - os: macos-latest
            arch: default
            compiler: clang
          - os: windows-latest
            arch: x86_64
            compiler: msvc

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Install dependencies
        run: |
          if [ matrix.os == 'ubuntu-latest' ]; then
            sudo apt-get update -y
            sudo apt-get install -y cmake libsdl2-dev libsdl2-mixer-dev libsdl2-net-dev
            if [ matrix.arch == "armv7l" ]; then
              sudo apt-get install -y gcc-arm-linux-gnueabihf
              export CC=arm-linux-gnueabihf-gcc
            fi
          elif [ matrix.os == 'macos-latest' ]; then
            brew update
            brew install cmake sdl2 sdl2_mixer sdl2_net
          elif [ matrix.os == 'windows-latest' ]; then
            choco install -y cmake mingw sdl2 sdl2_mixer sdl2_net
          fi

      - name: Configure
        run: |
          mkdir build
          cd build

          if [ "$matrix.arch" == "x86_64" ]; then
            cmake -S . -B build -DUSE_SDL=2
          elif [ "$matrix.arch" == "armv7l" ]; then
            cmake -S . -B build -DCMAKE_TOOLCHAIN_FILE=cmake/toolchains/arm-linux-gnueabihf.cmake -DUSE_SDL=2
          fi
          
#        run: cmake -S . -B build -DUSE_SDL=2

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: |
          if [ "$matrix.os" == "ubuntu-latest" ]; then
            cd build
            ctest --output-on-failure
          fi
