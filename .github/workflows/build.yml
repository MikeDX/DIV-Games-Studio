name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            compiler: gcc
          - os: ubuntu-latest
            compiler: clang
          - os: macos-latest
            compiler: clang
          - os: windows-latest
            compiler: msvc

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Install dependencies
        run: |
          if [ "$RUNNER_OS" == "Linux" ]; then
            sudo apt-get update -y
            sudo apt-get install -y cmake libsdl2-dev libsdl2-mixer-dev
          elif [ "$RUNNER_OS" == "Windows" ]; then
            choco install -y cmake mingw sdl2 sdl2_mixer
          else
            brew update
            brew install cmake sdl2 sdl2_mixer
          fi

      - name: Configure
        run: cmake -S . -B build -DUSE_SDL=2

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: |
          if [ "$matrix.os" == "ubuntu-latest" ]; then
            cd build
            ctest --output-on-failure
          fi
